
name: Update Predictions and Publish Website

on:
  push:
    branches:
      - main

  schedule:
    - cron: "30 6 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh lottery data and generate predictions
        run: python -m src.daily_prediction

      - name: Export predictions to JSON
        run: python -m src.export_website_predictions

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
